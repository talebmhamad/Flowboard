name: Backend CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Solution
        run: dotnet restore backend/Flowboard.sln

      - name: Build Solution
        run: dotnet build backend/Flowboard.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test backend/Flowboard.sln --configuration Release --no-build --verbosity normal
